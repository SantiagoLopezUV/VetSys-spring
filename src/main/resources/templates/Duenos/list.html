<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dueños VetSys</title>
</head>

<body>

<h1>Lista de Dueños</h1>

<a th:href="@{/view/duenos/form}">
    Registrar Dueño
</a>

<br><br>

<p th:if="${param.message}" th:text="${param.message}"></p>
<p th:if="${messsage}" th:text="${messsage}"></p>
<p th:if="${message}" th:text="${message}"></p>
<p th:if="${success}" th:text="${success}"></p>
<p th:if="${message}" th:text="${message}"></p>

<table border="1">

    <thead>
    <tr>
        <th>Acciones</th>
        <th>ID</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Correo</th>
        <th>Dirección</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="dueno : ${duenos}">

        <td>

            <a th:href="@{'/view/duenos/edit/' + ${dueno.id_dueno}}">
                Editar
            </a>

            <form th:action="@{'/view/duenos/delete/' + ${dueno.id_dueno}}"
                  method="post">

                <button type="submit">
                    Eliminar
                </button>

            </form>

        </td>
        <td th:text="${dueno.id_dueno}"></td>
        <td th:text="${dueno.nombre}"></td>
        <td th:text="${dueno.telefono}"></td>
        <td th:text="${dueno.correo}"></td>
        <td th:text="${dueno.direccion}"></td>
    </tr>

    </tbody>

</table>

</body>
</html>
