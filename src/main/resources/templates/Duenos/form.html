<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dueños VetSys</title>
</head>

<body>

<h1 th:text="${duenos.id_dueno == null} ? 'Registrar Dueño' : 'Editar Dueño'">
    Registrar Dueño
</h1>

<form th:action="@{/view/duenos/save}"
      th:object="${duenos}"
      method="post">

    <input type="hidden" th:field="*{id_dueno}">

    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}" required>
    <br><br>

    <label>Teléfono:</label>
    <input type="text" th:field="*{telefono}" required>
    <br><br>

    <label>Correo:</label>
    <input type="email" th:field="*{correo}" required>
    <br><br>

    <label>Direccion:</label>
    <input type="text" th:field="*{direccion}" required>
    <br><br>

    <button type="submit">Guardar Dueño</button>

    <a th:href="@{/view/duenos}">Volver</a>

</form>

</body>
</html>
