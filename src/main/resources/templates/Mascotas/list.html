<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mascotas VetSys</title>
</head>

<body>

<h1>Lista de Mascotas</h1>

<a th:href="@{/view/mascotas/form}">
    <button type="button">
        Registrar Mascota
    </button>
</a>

<br><br>

<p th:if="${param.message}" th:text="${param.message}"></p>
<p th:if="${messsage}" th:text="${messsage}"></p>
<p th:if="${message}" th:text="${message}"></p>
<p th:if="${success}" th:text="${success}"></p>

<table border="1">

    <thead>
    <tr>
        <th>Acciones</th>
        <th>ID</th>
        <th>Nombre</th>
        <th>Especie</th>
        <th>Dueño</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="mascota : ${mascotas}">
        <td>
            <a th:href="@{'/view/mascotas/edit/' + ${mascota.id_mascota}}">
                <button type="button">
                    Editar
                </button>
            </a>

            <form th:action="@{'/view/mascotas/delete/' + ${mascota.id_mascota}}"
                  method="post">
                <button type="submit">
                    Eliminar
                </button>
            </form>
        </td>
        <td th:text="${mascota.id_mascota}"></td>
        <td th:text="${mascota.nombre}"></td>
        <td th:text="${mascota.especie}"></td>
        <td th:text="${mascota.dueno != null ? mascota.dueno.nombre : 'Sin dueño'}"></td>
    </tr>
    </tbody>

</table>
</body>
</html>
