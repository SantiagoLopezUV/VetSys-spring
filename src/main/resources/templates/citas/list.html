<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Citas Médicas VetSys</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>

<h1>Lista de Citas VetSys</h1>

<a th:href="@{/view/citas/form}">
    <button type="button">Registrar Nueva Cita</button>
</a>

<br><br>

<p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold;"></p>
<p th:if="${error}" th:text="${error}" style="color: red; font-weight: bold;"></p>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>Acciones</th>
        <th>ID</th>
        <th>Fecha</th>
        <th>Mascota</th>
        <th>Dueño</th>
        <th>Veterinario</th>
        <th>Motivo</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cita : ${citas}">
        <td>
            <a th:href="@{'/view/citas/edit/' + ${cita.id_cita}}">
                <button type="button">Editar</button>
            </a>

            <form th:action="@{'/view/citas/delete/' + ${cita.id_cita}}" method="post" style="display:inline;"
                  onsubmit="return confirm('¿Seguro que deseas eliminar esta cita?');">
                <button type="submit">Eliminar</button>
            </form>

            <a th:href="@{/view/tratamientos/form(idCita=${cita.id_cita})}">
                <button type="button">Tratamiento</button>
            </a>
        </td>
        <td th:text="${cita.id_cita}"></td>
        <td th:text="${cita.fecha}"></td>
        <td th:text="${cita.mascota != null ? cita.mascota.nombre : 'Sin asignar'}"></td>
        <td th:text="${cita.mascota != null and cita.mascota.dueno != null ? cita.mascota.dueno.nombre : 'Sin dueño'}"></td>
        <td th:text="${cita.veterinario}"></td>
        <td th:text="${cita.motivo}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(citas)}">
        <td colspan="7" style="text-align: center;">No hay citas médicas registradas.</td>
    </tr>
    </tbody>
</table>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
