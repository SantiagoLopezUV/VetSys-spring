<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tratamientos VetSys</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>

<h1>Lista de Tratamientos</h1>

<a th:href="@{/view/tratamientos/form}">
    <button type="button">Registrar Nuevo Tratamiento</button>
</a>

<br><br>

<p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold;"></p>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>Acciones</th>
        <th>ID</th>
        <th>Cita Médica</th>
        <th>Mascota</th>
        <th>Descripción / Medicamento</th>
        <th>Dosis / Frecuencia</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="tratamiento : ${tratamientos}">
        <td>
            <a th:href="@{'/view/tratamientos/edit/' + ${tratamiento.id_tratamiento}}">
                <button type="button">Editar</button>
            </a>

            <form th:action="@{'/view/tratamientos/delete/' + ${tratamiento.id_tratamiento}}" method="post" style="display:inline;"
                  onsubmit="return confirm('¿Seguro que deseas eliminar este tratamiento?');">
                <button type="submit">Eliminar</button>
            </form>
        </td>
        <td th:text="${tratamiento.id_tratamiento}"></td>
        <td>
            <span th:if="${tratamiento.cita != null}"
                  th:text="${'Cita #' + tratamiento.cita.id_cita + ' (' + tratamiento.cita.fecha + ')'}">
            </span>
            <span th:unless="${tratamiento.cita != null}">Sin cita</span>
        </td>
        <td th:text="${tratamiento.cita != null and tratamiento.cita.mascota != null ? tratamiento.cita.mascota.nombre : 'N/A'}"></td>
        <td th:text="${tratamiento.descripcion}"></td>
        <td th:text="${tratamiento.dosis}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(tratamientos)}">
        <td colspan="6" style="text-align: center;">No hay tratamientos registrados.</td>
    </tr>
    </tbody>
</table>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
