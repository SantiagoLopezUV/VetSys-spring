<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Tratamiento VetSys</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>

<h1 th:text="${tratamiento.id_tratamiento == null} ? 'Registrar Tratamiento' : 'Editar Tratamiento'">Registrar Tratamiento</h1>

<form th:action="@{/view/tratamientos/save}" th:object="${tratamiento}" method="post">

    <input type="hidden" th:field="*{id_tratamiento}">

    <div>
        <label>Cita:</label><br>
        <select th:field="*{idCita}" required>
            <option value="">Selecciona una Cita</option>
            <option th:each="c : ${citas}"
                    th:value="${c.id_cita}"
                    th:text="${'Cita #' + c.id_cita + ' - ' + c.fecha + ' - ' + (c.mascota != null ? c.mascota.nombre : 'Sin mascota') + ' (Motivo: ' + c.motivo + ')'}">
            </option>
        </select>
    </div>
    <br>

    <div>
        <label>Descripción / Medicamento / Procedimiento:</label><br>
        <input type="text" th:field="*{descripcion}" placeholder="Ej: Amoxicilina 500mg, Vacuna antirrábica, Limpieza dental" required size="50">
    </div>
    <br>

    <div>
        <label>Dosis / Frecuencia / Instrucciones:</label><br>
        <input type="text" th:field="*{dosis}" placeholder="Ej: 1 tableta cada 12 horas por 7 días" required size="50">
    </div>
    <br>

    <button type="submit">Guardar Tratamiento</button>
    <a th:href="@{/view/tratamientos}">
        <button type="button">Volver</button>
    </a>

</form>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
