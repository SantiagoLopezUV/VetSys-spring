<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mascotas VetSys</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>

<h1>Lista de Mascotas</h1>

<a th:href="@{/view/mascotas/form}">
    <button type="button">
        Registrar Mascota
    </button>
</a>

<br><br>

<p th:if="${param.message}" th:text="${param.message}" style="color: green; font-weight: bold;"></p>
<p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold;"></p>
<p th:if="${error}" th:text="${error}" style="color: red; font-weight: bold;"></p>

<table border="1">

    <thead>
    <tr>
        <th>Acciones</th>
        <th>ID</th>
        <th>Nombre</th>
        <th>Especie</th>
        <th>Dueño</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="mascota : ${mascotas}">
        <td>
            <a th:href="@{'/view/mascotas/edit/' + ${mascota.id_mascota}}">
                <button type="button">
                    Editar
                </button>
            </a>

            <form th:action="@{'/view/mascotas/delete/' + ${mascota.id_mascota}}"
                  method="post"
                  onsubmit="return confirm('¿Seguro que deseas eliminar esta mascota?');">
                <button type="submit">
                    Eliminar
                </button>
            </form>
        </td>
        <td th:text="${mascota.id_mascota}"></td>
        <td th:text="${mascota.nombre}"></td>
        <td th:text="${mascota.especie}"></td>
        <td th:text="${mascota.dueno != null ? mascota.dueno.nombre : 'Sin dueño'}"></td>
    </tr>
    </tbody>

</table>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
