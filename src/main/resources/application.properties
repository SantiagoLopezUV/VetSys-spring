spring.application.name=vetsys

# creacion de la BD automaticamente
spring.datasource.url=jdbc:mysql://localhost:3306/vetsys?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show.sql=true

# Inicialización automática de datos de prueba desde data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
